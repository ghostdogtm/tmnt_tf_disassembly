# ld65 config: iNES header + 128KB PRG (16 MMC3 banks of 8KB) + 128KB CHR. Generated by tools/disasm.py
# even banks run at $8000, odd banks at $A000, bank 0E at $C000, bank 0F at $E000
MEMORY {
    HDR:     start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG_00:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $00;
    PRG_01:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $01;
    PRG_02:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $02;
    PRG_03:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $03;
    PRG_04:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $04;
    PRG_05:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $05;
    PRG_06:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $06;
    PRG_07:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $07;
    PRG_08:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $08;
    PRG_09:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $09;
    PRG_0A:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0A;
    PRG_0B:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0B;
    PRG_0C:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0C;
    PRG_0D:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0D;
    PRG_0E:  start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0E;
    PRG_0F:  start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0F;
    CHR:     start = $0000, size = $20000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:  load = HDR, type = ro;
    BANK_00: load = PRG_00, type = ro;
    BANK_01: load = PRG_01, type = ro;
    BANK_02: load = PRG_02, type = ro;
    BANK_03: load = PRG_03, type = ro;
    BANK_04: load = PRG_04, type = ro;
    BANK_05: load = PRG_05, type = ro;
    BANK_06: load = PRG_06, type = ro;
    BANK_07: load = PRG_07, type = ro;
    BANK_08: load = PRG_08, type = ro;
    BANK_09: load = PRG_09, type = ro;
    BANK_0A: load = PRG_0A, type = ro;
    BANK_0B: load = PRG_0B, type = ro;
    BANK_0C: load = PRG_0C, type = ro;
    BANK_0D: load = PRG_0D, type = ro;
    BANK_0E: load = PRG_0E, type = ro;
    BANK_0F: load = PRG_0F, type = ro;
    CHR_ROM: load = CHR, type = ro;
}

FILES {
    %O: format = bin;
}
